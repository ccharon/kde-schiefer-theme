[skin]
    description = Schiefer: black on the light text field, dialogs and menus in the dialog gray, Motif mnemonics underlined
    256colors = false

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = black;default
    selected = white;blue
    marked = red;default;bold
    markselect = white;red;bold
    gauge = white;blue
    input = black;default
    inputunchanged = gray;default
    inputmark = white;blue
    disabled = gray;lightgray
    reverse = white;blue
    commandlinemark = white;blue
    header = blue;default;bold
    inputhistory =
    commandhistory =
    shadow = gray;black

[dialog]
    _default_ = black;lightgray
    dfocus = white;blue
    dhotnormal = black;lightgray;underline
    dhotfocus = white;blue;underline
    dtitle = black;lightgray;bold

[error]
    _default_ = white;red
    errdfocus = black;lightgray
    errdhotnormal = white;red;underline
    errdhotfocus = black;lightgray;underline
    errdtitle = white;red;bold

[filehighlight]
    directory = blue;;bold
    executable = green;;bold
    symlink = cyan;
    hardlink =
    stalelink = red;;bold
    device = magenta;
    special = brown;
    core = red;
    temp = gray;
    archive = magenta;
    doc = brown;
    source = cyan;
    media = green;
    graph = magenta;
    database = red;

[menu]
    _default_ = black;lightgray
    menusel = white;blue
    menuhot = black;lightgray;underline
    menuhotsel = white;blue;underline
    menuinactive = gray;lightgray

[popupmenu]
    _default_ = black;lightgray
    menusel = white;blue
    menutitle = black;lightgray;bold

[buttonbar]
    hotkey = black;default;bold
    button = black;lightgray

[statusbar]
    _default_ = black;lightgray

[help]
    _default_ = black;default
    helpitalic = red;default
    helpbold = blue;default;bold
    helplink = blue;default;underline
    helpslink = white;blue
    helptitle = black;default;bold

[editor]
    _default_ = lightgray;black
    editbold = yellow;black;bold
    editmarked = white;blue
    editwhitespace = gray;black
    editnonprintable = ;gray
    editlinestate = black;lightgray
    bookmark = white;red
    bookmarkfound = white;green
    editrightmargin = gray;black
    editframeactive = white;
    editframedrag = brightgreen;

[viewer]
    _default_ = black;default
    viewbold = black;default;bold
    viewunderline = blue;default;underline
    viewselected = white;blue

[diffviewer]
    added = white;green
    changedline = black;lightgray
    changednew = blue;lightgray;bold
    changed = black;lightgray
    removed = white;red
    error = white;red

[widget-panel]
    sort-up-char = '
    sort-down-char = .
    filename-scroll-left-char = {
    filename-scroll-right-char = }

[widget-editor]
    window-state-char = *
    window-close-char = X
