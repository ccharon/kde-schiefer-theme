[General]
# "Schiefer" palette; "schiefer-config system-palette" writes another one into theme.conf.user
background=backdrops/schiefer.png
backgroundColor=#8fa3bf
dialogColor=#bec2d3
textColor=#000000
fieldColor=#e2e5ed
fieldTextColor=#000000
activeColor=#60729e
activeTextColor=#ffffff
alertColor=#a02828
# host name instead of a greeting; empty = host name of the system
hostName=
# line below the host name (the ebuild sets PRETTY_NAME from /etc/os-release)
subtitle=
showClock=true
# image in the picture panel on the right; empty = emblem and name
logo=
# font size in points; empty = system font, at least 10 pt
fontSize=
