# Schiefer – helles Schieferblau-grau (Nachfolger des früheren colors/Schiefer.colors)
# Farbsätze wie bei CDE: 1 Aktivrahmen, 2 Inaktivrahmen, 3–4 Arbeitsflächen, 5 Textflächen,
# 6 Hauptfenster, 7 Dialoge/Knöpfe, 8 Frontpanel. Alles Weitere leitet make_palette.py ab.
id = "Schiefer"
name = "Schiefer"
comment = "helles Solaris/CDE-artiges Farbschema (nachempfunden, keine Originalwerte)"
variant = "light"

[cde]
1 = "#60729e"   # Aktivrahmen: kräftiges Schieferblau, deutlich vom Inhalt abgesetzt
2 = "#aeb3c6"   # Inaktivrahmen: etwas dunkler und grauer als das Fenster
3 = "#8fa3bf"
4 = "#bba78e"
5 = "#e2e5ed"   # Textflächen: klar heller als das Fenster
6 = "#bec2d3"   # Hauptfenster 190,194,211 (wie bisher)
7 = "#bec2d3"
8 = "#969eb8"

[schiefer]
desktops = ["3", "4", "#7fa39a", "#b48f96", "#a8a47e", "#9c90b5", "#8faf8f", "#c09c7c"]
tooltip = "#ece9d6"
